name: 03 - Workflow Runners

on: push

jobs:
  ubuntu-echo:
    runs-on: ubuntu-latest
    steps:
      - name: Show OS
        run: |
          echo "运行系统: $RUNNER_OS"

  windows-echo:
    runs-on: windows-latest
    steps:
      - name: Show OS
        shell: bash
        run: |
          echo "运行系统: $RUNNER_OS"

  mac-echo:
    runs-on: macos-latest
    steps:
      - name: Show OS
        run: |
          echo "运行系统: $RUNNER_OS"
